services:
  patito:
    container_name: patito
    restart: always
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    # - ./src:/home
    depends_on:
      - db

  frontendpatito:
    container_name: frontendpatito
    restart: always
    build: .
    ports:
      - "8081:80"
    volumes:
      - ./src-frontend:/var/www/html
    depends_on:
      - patito

  db:
    image: mariadb:12.3.1-ubi10-rc
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: patito_db
      MYSQL_USER: patito_user
      MYSQL_PASSWORD: patito_pass
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql

volumes:
  db_data: